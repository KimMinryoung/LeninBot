name = "leninbot-watchdog"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Every 5 minutes. The site check wants to be prompt; the dead-man's switch
# deadlines are all far coarser than this, so 5 minutes costs nothing extra.
[triggers]
crons = ["*/5 * * * *"]

# `id` is filled in by scripts/deploy_watchdog.sh after it creates the namespace.
[[kv_namespaces]]
binding = "WATCHDOG"
id = "2bd07d4e2bff4f29979864c35dd8fdb9"

# Secrets are NOT set here — they go in with `wrangler secret put`:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, PING_TOKEN
