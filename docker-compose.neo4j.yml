services:
  pg:
    image: pgvector/pgvector:pg17
    container_name: leninbot-pg
    restart: unless-stopped
    # Docker's default 64MB /dev/shm breaks parallel HNSW index builds during
    # pg_restore (found by restore drill 2026-07-28).
    shm_size: 1g
    ports:
      - "127.0.0.1:5434:5432"   # localhost only; serves both `leninbot` and `writer` DBs
      # Tailnet only, for the leninbot-standby streaming replica (2026-08-01).
      # Binding a specific IP means the container cannot start before tailscaled
      # has assigned it — leninbot-neo4j.service waits for the address first.
      - "100.122.248.77:5434:5432"
    # No POSTGRES_PASSWORD here: initdb already ran (2026-07-28) with the main
    # DB_PASSWORD from the credstore; the data volume carries it from now on.
    environment:
      - POSTGRES_DB=leninbot
      # Debian glibc image; locale pinned at initdb (legacy writer-pg was musl/alpine).
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=2GB
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leninbot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  neo4j:
    image: neo4j:5-community
    container_name: leninbot-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # Browser (localhost only)
      - "127.0.0.1:7687:7687"   # Bolt (localhost only)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_LOCAL_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: leninbot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
